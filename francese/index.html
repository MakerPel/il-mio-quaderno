<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a64d4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Il mio quaderno">
<meta name="description" content="Esercizi di francese: lessico, frasi e civiltà.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="../icon-192.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Quaderno di francese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f9fe; --grid:#e1e8f6; --card:#ffffff; --line:#cdd7ec;
  --ink:#1d2b4f; --muted:#56627f;
  --blue:#2a64d4; --pink:#d6336c; --yellow:#ffd43b; --green:#2b9348; --box:#8cc63f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana",system-ui,sans-serif;
  color-scheme:light;
  /* layout: indice a schede raggruppate → foglio d'esercizio con tastierino fisso in basso */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--card);border-bottom:2px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;margin-right:auto}
.levels{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px}
.levels button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted);min-height:42px}
.levels button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stars{font-family:var(--display);font-weight:800;font-size:22px;color:#8a6400;background:#fff3c2;border:2px solid #f1d572;border-radius:999px;padding:2px 14px;font-variant-numeric:tabular-nums}
.stars.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.stars.pop{animation:none}}
.hublink{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.ghost{border:2px solid var(--line);background:var(--paper);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 32px}
.wrap{max-width:1000px;margin:0 auto}

/* indice */
.intro{max-width:62ch;color:var(--muted);margin:4px 0 8px;line-height:1.5}
.group h2{font-family:var(--display);font-size:20px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:150px;box-shadow:0 4px 0 var(--line)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.glyph{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;padding:8px 12px;border-radius:10px;background:var(--paper);border:2px dashed var(--line);white-space:nowrap}
.tile b{font-family:var(--display);font-size:20px;line-height:1.15;margin-top:4px}
.tile span{color:var(--muted);font-size:15px;line-height:1.35}

/* foglio */
.sheet{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 0 var(--line)}
.kicker{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sheet h1{font-family:var(--display);font-size:28px;line-height:1.1;margin:2px 0 6px;text-wrap:balance}
.consegna{font-weight:700;text-transform:uppercase;margin:0 0 16px;color:var(--muted);line-height:1.45;font-size:16px}
.q{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin:12px 0;font-weight:700;text-transform:uppercase;line-height:1.4}
.slot{min-width:72px;height:56px;border:3px solid var(--box);border-radius:10px;background:#fff;font-family:var(--display);font-size:28px;font-weight:800;padding:0 8px;font-variant-numeric:tabular-nums;line-height:1}
.slot.on{border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
.slot.ok{border-color:var(--green);background:#e6f5ea}
.slot.no{border-color:var(--pink);background:#fde7ef}
.given{min-width:56px;height:56px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;font-weight:800}
.eq{display:flex;align-items:flex-start;gap:8px 10px;flex-wrap:wrap;margin:18px 0 6px;padding:14px;background:var(--paper);border-radius:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.col small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;max-width:90px}
.op{font-family:var(--display);font-size:32px;font-weight:800;height:56px;display:inline-flex;align-items:center}
.op.small{font-size:18px;text-transform:uppercase;color:var(--muted)}
.choice{display:inline-flex;gap:8px;flex-wrap:wrap;border-radius:14px;padding:3px}
.choice.ok{box-shadow:0 0 0 3px var(--green)}
.choice.no{box-shadow:0 0 0 3px var(--pink)}
.chip{min-height:50px;min-width:50px;padding:0 16px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:18px}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}

/* divisione */
.field{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:2px dashed var(--line);border-radius:14px;margin-bottom:8px}
.obj{width:58px;height:58px;border-radius:14px;border:2px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.obj.pending{border-color:var(--blue);background:#e3ecfd}
.obj.grouped{border-color:#0002}
.obj svg{width:44px;height:44px}

/* incroci */
.hit{fill:transparent;cursor:pointer}
.mark{fill:var(--pink);pointer-events:none;display:none}
.mark.on{display:block}
svg.board{width:100%;height:auto;display:block;touch-action:manipulation}

/* numeri relativi */
.expr{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:.02em;text-transform:none}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cmprow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--paper);border-radius:14px}
.num{font-family:var(--display);font-size:30px;font-weight:800;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.sym .chip{font-family:var(--display);font-size:26px;padding:0;width:50px}
.pair .chip{font-family:var(--display);font-size:28px;min-width:96px;height:64px;border-width:3px}
.pair .chip.sel{background:var(--yellow);color:var(--ink);border-color:#d9aa00}
.neg{color:var(--pink)} .pos{color:var(--blue)}

/* codice */
.word{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px}
.lcell{display:flex;flex-direction:column;align-items:center;gap:4px}
.lcell .lab{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap;min-height:26px}
.gap{width:26px}
.lslot{width:56px;height:60px;border:3px solid var(--box);border-radius:10px;background:#fff;font-family:var(--display);font-size:32px;font-weight:800}
.lslot.on{border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
.lslot.ok{border-color:var(--green);background:#e6f5ea}
.lslot.no{border-color:var(--pink);background:#fde7ef}
.ctable{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px}
@media (max-width:700px){.ctable{grid-template-columns:repeat(7,minmax(0,1fr))}}
.ccell{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border:2px solid var(--line);border-radius:10px;background:#fff}
.ccell .n{font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.ccell b{font-family:var(--display);font-size:22px}

/* frazioni */
.fracrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.figbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;border-radius:14px;border:3px solid transparent}
.figbox.ok{border-color:var(--green)} .figbox.no{border-color:var(--pink)}
.part{fill:#fff;stroke:var(--ink);stroke-width:2;cursor:pointer}
.part.on{fill:#79aaf7}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.frac>span:first-child{border-bottom:3px solid var(--ink);padding:0 6px 2px;min-width:40px;text-align:center}
.frac .slot{height:48px;min-width:56px;font-size:24px;margin-bottom:4px}
.bigop{font-family:var(--display);font-size:40px;font-weight:800}

/* piano */
.pts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:10px}
.next{padding:10px 14px;border-radius:12px;background:#e3ecfd;font-weight:700;margin:8px 0 4px}

/* collega */
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
.mcol{display:flex;flex-direction:column;gap:10px}
.pic,.nm{position:relative;border:3px solid var(--line);background:#fff;border-radius:14px;min-height:96px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px}
.pic svg{width:84px;height:84px}
.nm{font-weight:700;text-transform:uppercase;font-size:18px}
.pic.sel,.nm.sel{border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
.pic.no{border-color:var(--pink)!important;background:#fde7ef}
.pic.ok{border-color:var(--green)!important;background:#e6f5ea}
.badge{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-family:var(--display);display:flex;align-items:center;justify-content:center;font-size:17px}


/* nuovi esercizi */
.card{background:var(--paper);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcq{margin:4px 0}
.mcq .q{margin:6px 0}
.givens{font-family:var(--display);font-weight:800;font-size:22px;display:grid;gap:2px;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hint{color:#6b5200;font-size:15px;font-weight:700;background:#fff3c2;padding:8px 12px;border-radius:10px;display:inline-block;margin:4px 0 8px;line-height:1.4}
.alg{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:28px;text-transform:none}
.alg.big{font-size:30px;line-height:1.4;margin-bottom:4px;overflow-wrap:anywhere}
.nbox{border:2px solid var(--line);border-radius:10px;padding:2px 12px;background:#fff}
.field.mini{border-style:solid;padding:8px;margin:0;max-width:340px}
.field.bad{border-color:var(--pink);background:#fde7ef}
.addrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.obj.still{width:48px;height:48px}
.obj.cut{position:relative}
.obj.cut::after{content:"";position:absolute;inset:4px;background:linear-gradient(45deg,transparent 44%,#d6336c 44%,#d6336c 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#d6336c 44%,#d6336c 56%,transparent 56%)}
.flab{font-family:var(--display);font-size:24px}
.next.bad{background:#fde7ef;color:var(--pink)}

/* accesso e insegnante */
.who{font-size:15px;white-space:pre}
.loginwrap{display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto}
.hero{font-family:var(--display);font-size:clamp(30px,5vw,44px);line-height:1.05;margin:8px 0 4px;text-wrap:balance}
.logingrid.one{grid-template-columns:minmax(0,620px)}
.roster-in[hidden]{display:none}
.btn.small{min-height:44px;padding:0 14px;font-size:16px}
.logingrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.login{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);gap:12px;padding:20px}
.login h2{font-family:var(--display);font-size:24px;margin:0}
.login h3{font-family:var(--display);font-size:19px;margin:0;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;color:var(--muted)}
.fld input{font:inherit;font-size:22px;font-weight:700;color:var(--ink);padding:10px 14px;border:3px solid var(--line);border-radius:12px;background:#fff;min-height:54px;-webkit-user-select:text;user-select:text}
.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
#l-cod,#r-cod{text-transform:uppercase;letter-spacing:.15em;font-family:var(--display)}
.err{color:var(--pink);font-weight:700;margin:0;min-height:1.2em}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;text-decoration:underline;align-self:flex-start;min-height:44px;padding:0}
.codebox{display:inline-flex;align-items:center;gap:14px;background:#fff3c2;border:2px dashed #e0b400;border-radius:14px;padding:10px 16px;margin:8px 0 14px;flex-wrap:wrap}
.codebox span{font-weight:700;color:#6b5200}
.codebox b{font-family:var(--display);font-size:34px;letter-spacing:.18em}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpis div{background:var(--paper);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;min-width:120px}
.kpis b{font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{color:var(--muted);font-weight:700;font-size:14px}
.tablewrap{overflow-x:auto}
table.rep{width:100%;border-collapse:collapse;font-size:16px}
.rep th{text-align:left;font-size:13px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
.rep td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rep td.n{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.rep.small td{padding:6px 8px;font-size:15px}.rep.small td.n{font-size:17px}
.bar{display:inline-flex;align-items:center;gap:8px;min-width:140px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--green);min-width:2px}
.bar em{font-style:normal;font-weight:800;font-family:var(--display)}
.det td{background:var(--paper)}
.detbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:6px 0}
.danger{color:var(--pink);border-color:#f3b6c8}

/* euro */
.purse{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:2px dashed var(--line);border-radius:14px;min-height:74px;background:#fff}
.purse.tray{border-style:solid;background:var(--paper);margin-top:6px}
.purse.pay.ok{border:3px solid var(--green);background:#e6f5ea}
.purse.pay.no{border:3px solid var(--pink);background:#fde7ef}
.money{display:block;flex:none}
.mbtn{border:0;background:none;padding:3px;border-radius:10px;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center}
.mbtn:active{transform:scale(.94)}
.ph{color:var(--muted);font-weight:700}
.prod{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:110px;text-align:center}
.emo{font-size:40px;line-height:1.15}
.pname{font-weight:700;text-transform:uppercase;font-size:14px}
.price{font-family:var(--display);font-weight:800;font-size:22px;color:var(--pink);font-variant-numeric:tabular-nums}
.prod.big{border:0;background:none}.prod.big .emo{font-size:76px}.prod.big .pname{font-size:18px}.prod.big .price{font-size:34px}
.flyer{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px;padding:12px;border-radius:14px;background:#fff6d8;border:2px solid #f1d572}
.rows{display:flex;flex-direction:column;gap:12px}
.rowcard{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.cap{color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;width:100%}
.ptext{font-size:19px;line-height:1.5;margin:0 0 6px;max-width:70ch}

/* italiano */
.reading{background:#fffdf6;border:2px solid #efe3c4;border-radius:16px;padding:16px 18px;font-size:20px;line-height:1.65;max-height:70vh;overflow:auto;-webkit-user-select:text;user-select:text}
.reading p{margin:0 0 .6em}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rhead h2{font-family:var(--display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.speak{font-size:16px}
.mcq .q{text-transform:none;font-size:18px}
.card.vf{margin-bottom:10px}.card.vf .q{text-transform:none;margin:0}
.answer{font-size:18px}
.wchip{min-height:48px;padding:0 14px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:19px}
.wchip:disabled{opacity:.3}
.wchip.in{background:#e3ecfd;border-color:var(--blue)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.built{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:8px;border:2px dashed var(--line);border-radius:12px;background:#fff;align-items:center}
.built.ok{border:3px solid var(--green);background:#e6f5ea}.built.no{border:3px solid var(--pink);background:#fde7ef}
.seq{display:flex;flex-direction:column;gap:10px;border-radius:14px;padding:4px}
.seq.ok{box-shadow:0 0 0 3px var(--green)}.seq.no{box-shadow:0 0 0 3px var(--pink)}
.seqcard{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:19px;line-height:1.4;min-height:60px}
.seqcard .num{flex:none;width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px}
.seqcard.on{border-color:var(--blue);background:#eef3ff}.seqcard.on .num{background:var(--blue);color:#fff;border-style:solid;border-color:var(--blue)}
.cloze{margin:0;line-height:2.3}
.blank{min-width:110px;height:42px;vertical-align:middle;border:0;border-bottom:3px solid var(--box);background:#f3f9ea;border-radius:8px 8px 0 0;font:inherit;font-weight:700;padding:0 8px;margin:0 2px}
.blank.on{border-bottom-color:var(--blue);background:#e3ecfd}.blank.ok{border-bottom-color:var(--green);background:#e6f5ea}.blank.no{border-bottom-color:var(--pink);background:#fde7ef}
.word{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.ctx{margin:4px 0;font-size:18px;line-height:1.5}
.ctx mark{background:#fff3c2;padding:0 3px;border-radius:4px;font-weight:700}
.defs{flex-direction:column;align-items:stretch;width:100%}
.defs .chip{text-align:left;padding:10px 14px;line-height:1.35}
.legend{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tg{font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;color:#fff}
.tg.n,.tw.n{background:#2a64d4;color:#fff;border-color:#2a64d4}
.tg.v,.tw.v{background:#d6336c;color:#fff;border-color:#d6336c}
.tg.a,.tw.a{background:#2b9348;color:#fff;border-color:#2b9348}
.tagline{font-size:24px;line-height:2.2;margin:0}
.tw{border:2px solid transparent;background:#f2f5fb;border-radius:10px;padding:2px 8px;font:inherit;font-weight:700;min-height:44px}
.tw.bad{outline:3px solid var(--pink);outline-offset:1px}

/* inglese */
.emo.big{font-size:60px;line-height:1.1}
.say{border:0;background:#e3ecfd;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.enw{font-size:20px}
.col1{flex-direction:column;align-items:stretch;width:100%}
.col1 .chip{text-align:left;padding:8px 14px;line-height:1.3;text-transform:none}
.colours .chip{text-transform:none}
.street{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 12px 34px;background:#eef3ff;border-radius:16px;margin-bottom:10px}
.bld{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:14px;position:relative;z-index:1}
.road{position:absolute;left:0;right:0;bottom:8px;height:16px;background:repeating-linear-gradient(90deg,#9aa6c2 0 26px,#fff 26px 40px);border-radius:4px;opacity:.7}
.postcard{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:14px;border-radius:16px;background:#fff6d8;border:2px dashed #e0b400;margin-bottom:14px}
.pc{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:12px;padding:8px 4px;text-align:center}
.pc .emo{font-size:34px}.pc small{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px}
.letters .wchip,.letters+.bank .wchip{font-family:var(--display);font-size:26px;min-width:50px;text-transform:lowercase}

/* francese */
.seqtxt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.letter{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",var(--body);background:#fffef8;border-color:#e7dcc0}
.letter p{margin:0 0 .35em}
.flagfr{display:flex;width:120px;height:80px;border-radius:8px;overflow:hidden;border:2px solid var(--line);margin:0 0 14px}
.flagfr i{flex:1}
.sech{font-family:var(--display);font-size:24px;margin:0 0 4px}
.roster{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--paper);border-radius:12px;flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.rinfo{display:flex;flex-direction:column;flex:1;min-width:160px}
.rinfo b{font-size:19px}.rinfo small{color:var(--muted);font-weight:700}
.danger.armed{background:var(--pink);color:#fff;border-color:var(--pink)}
/* barra in basso */
.dock{background:var(--card);border-top:2px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.keypad{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:6px;max-width:1000px;margin:0 auto 10px}
.keypad button{height:54px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-size:26px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.keypad button:active{transform:translateY(2px);box-shadow:none}
@media (max-width:620px){.keypad{grid-template-columns:repeat(7,minmax(0,1fr))}}
.actions{display:flex;gap:10px;max-width:1000px;margin:0 auto;align-items:center;flex-wrap:wrap}
.btn{min-height:54px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-family:var(--display);font-size:19px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.fb{flex:1;font-family:var(--display);font-weight:800;font-size:21px;min-width:180px;line-height:1.2}
.fb.ok{color:var(--green)} .fb.no{color:var(--pink)} .fb.info{color:var(--muted)}
[hidden]{display:none!important}

/* blocco in verticale sui dispositivi touch */
.rotate{display:none}
@media (orientation:landscape) and (hover:none) and (pointer:coarse){
  .rotate{display:flex;position:fixed;inset:0;z-index:9999;background:#2a64d4;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
  .rotate .ic{font-size:72px;line-height:1;animation:rot 2s ease-in-out infinite}
  .rotate b{font-size:30px}.rotate span{font-size:18px;opacity:.9;font-family:"Andika",Verdana,sans-serif}
  body{overflow:hidden}
}
@keyframes rot{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.rotate .ic{animation:none}}

let active=null;
function slot(ans){const b=h('button',{class:'slot',type:'button','aria-label':'casella da riempire'});b.dataset.v='';b.ans=ans;b.addEventListener('click',()=>focusSlot(b));return b;}
function focusSlot(b){if(active)active.classList.remove('on');active=b;if(b){b.classList.add('on');b.classList.remove('ok','no');}}
function setSlot(b,v){b.dataset.v=v;b.textContent=v.replace('-','−');b.classList.remove('ok','no');}
function keyPress(k){
  if(!cur)return;
  if(!active||!cur.el.contains(active)){const f=[...cur.el.querySelectorAll('.slot')].find(x=>x.dataset.v==='');if(!f)return;focusSlot(f);}
  let v=active.dataset.v;
  if(k==='back')v=v.slice(0,-1);
  else if(k==='neg')v=v.startsWith('-')?v.slice(1):'-'+v;
  else if(k==='comma'){if(v.includes(','))return;v=(v===''||v==='-')?v+'0,':v+',';}
  else{if(v.replace(/[-,]/g,'').length>=7)return;v=(v==='0'||v==='-0')?v.replace('0','')+k:v+k;}
  setSlot(active,v);
}
function checkSlots(root){let ok=true;root.querySelectorAll('.slot').forEach(b=>{const v=b.dataset.v;const x=Number(v.replace(',','.'));const good=v!==''&&v!=='-'&&!isNaN(x)&&Math.abs(x-b.ans)<0.001;b.classList.toggle('ok',good);b.classList.toggle('no',!good);b.classList.remove('on');if(!good)ok=false;});return ok;}
function solveSlots(root){root.querySelectorAll('.slot').forEach(b=>{setSlot(b,fmt(b.ans));b.classList.add('ok');});}
function choices(opts,ans,cls){const g=h('div',{class:'choice '+(cls||''),role:'group'});g.ans=ans;g.val=null;opts.forEach(o=>{const b=h('button',{type:'button',class:'chip'},o);b.addEventListener('click',()=>{g.val=o;g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===b));g.classList.remove('ok','no');});g.append(b);});return g;}
function checkChoices(root){let ok=true;root.querySelectorAll('.choice').forEach(g=>{const good=g.val===g.ans;g.classList.toggle('ok',good);g.classList.toggle('no',!good);if(!good)ok=false;});return ok;}
function solveChoices(root){root.querySelectorAll('.choice').forEach(g=>{g.val=g.ans;g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x.textContent===g.ans));g.classList.add('ok');g.classList.remove('no');});}

      else inner.append(h('p',{},'Nessun esercizio svolto.'));
      det.firstChild.append(inner);});
    list.append(h('div',{class:'tablewrap'},tb));}
  const today=new Date().toDateString();
  const ros=h('div',{class:'sheet',style:'margin-top:16px'},h('h2',{class:'sech'},`Alunni della classe (${al.length})`),
    h('p',{class:'intro',style:'margin:0 0 10px'},'Qui trovi tutti gli alunni che sono entrati nella classe. Tocca «Elimina» due volte per cancellare un alunno con tutti i suoi risultati.'));
  if(!al.length)ros.append(h('p',{class:'intro'},`Ancora nessun alunno. Dai il codice ${rep.codice} agli alunni.`));
  else{const ul=h('div',{class:'roster'});
    al.forEach(a=>{const oggi=new Date(a.ultimo_accesso).toDateString()===today;
      const del=h('button',{class:'ghost danger',type:'button'},'🗑️ Elimina');let armed=false,tm=null;
      del.addEventListener('click',async()=>{if(!armed){armed=true;del.textContent='Tocca ancora per confermare';del.classList.add('armed');tm=setTimeout(()=>{armed=false;del.textContent='🗑️ Elimina';del.classList.remove('armed');},4000);return;}
        clearTimeout(tm);del.disabled=true;del.textContent='Elimino…';
        try{await rpc('qm_elimina_alunno',{p_codice:teacher.codice,p_pin:teacher.pin,p_alunno:a.id});teacherView();}catch(x){del.disabled=false;del.textContent=x.message;}});
      ul.append(h('div',{class:'rrow'},h('span',{class:'av','aria-hidden':'true'},a.nome.slice(0,1).toUpperCase()),
        h('div',{class:'rinfo'},h('b',{},a.nome),h('small',{},(oggi?'🟢 entrato oggi · ':'Ultimo accesso: ')+when(a.ultimo_accesso)+` · ★ ${a.stelle} · ${a.tentativi} esercizi`)),del));});
    ros.append(ul);}
  view.replaceChildren(head,ros,list);
}

/* ---------- indice ed esercizi ---------- */
function home(){curEx=null;cur=null;active=null;dock.hidden=true;$('back').hidden=true;showHeader('app');
  view.replaceChildren(h('p',{class:'intro'},(sess&&sess.token?`Ciao ${sess.nome}! `:'')+'Scegli un esercizio. Ogni volta che premi «Nuovo esercizio» ne viene creato uno diverso. Il livello in alto cambia la difficoltà.'),
    ...GROUPS.map((g,gi)=>h('section',{class:'group'},h('h2',{},g),h('div',{class:'tiles'},EX.filter(e=>e.g===gi).map(e=>h('button',{type:'button',class:'tile',onclick:()=>{location.hash=e.id;}},h('span',{class:'glyph'},e.glyph),h('b',{},e.title),h('span',{},e.desc)))))));
  $('main').scrollTop=0;}
let area;
function openEx(ex){curEx=ex;$('back').hidden=false;dock.hidden=false;showHeader('app');area=h('div');
  view.replaceChildren(h('div',{class:'sheet'},h('div',{class:'kicker'},GROUPS[ex.g]),h('h1',{},ex.title),area));newEx();}
function newEx(){active=null;cur=curEx.make(level);cur.solved=false;cur.shown=false;cur.wrong=false;cur.saved=false;area.replaceChildren(cur.el);
  const hasSlots=!!cur.el.querySelector('.slot');keypad.hidden=!hasSlots;setFb('','');
  if(hasSlots){const f=cur.el.querySelector('.slot');if(f)focusSlot(f);}$('main').scrollTop=0;}
function setFb(t,c){fb.textContent=t;fb.className='fb '+c;}
$('bNew').addEventListener('click',()=>{leaveEx();newEx();});
$('bSol').addEventListener('click',()=>{if(!cur)return;cur.solve();if(!cur.solved){cur.shown=true;record(false,true);}setFb('Ecco la soluzione. Prova con un nuovo esercizio!','info');});
$('bChk').addEventListener('click',doCheck);
function doCheck(){if(!cur)return;const ok=cur.check();
  if(ok){const fresh=!cur.solved&&!cur.shown;setFb(pick(['Bravo!','Ottimo lavoro!','Perfetto!','Esatto!','Che campione!'])+(fresh?' +1 ★':''),'ok');
    if(fresh){stars++;if(!(sess&&sess.token))save('stars-'+SUBJ,stars);showStars();popStars();record(true,false);}cur.solved=true;}
  else{cur.wrong=true;setFb('Quasi! Controlla le parti in rosso e riprova.','no');}}
document.addEventListener('keydown',e=>{if(!curEx||e.target.tagName==='INPUT')return;if(/^[0-9]$/.test(e.key))keyPress(e.key);else if(e.key==='-')keyPress('neg');else if(e.key===','||e.key==='.')keyPress('comma');else if(e.key==='Backspace'){e.preventDefault();keyPress('back');}else if(e.key==='Enter'){e.preventDefault();doCheck();}});
function route(){
  const hs=location.hash.slice(1);
  if(curEx&&EX.find(e=>e.id===hs)!==curEx)leaveEx();
  if(hs==='insegnante')return teacherView();
  if(!sess)return loginView();
  const ex=EX.find(e=>e.id===hs);ex?openEx(ex):home();
}
window.addEventListener('hashchange',route);route();flush();refreshStars();
window.addEventListener('pagehide',leaveEx);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('../sw.js',{scope:'../'}).then(r=>r.update()).catch(()=>{});
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{});}catch(e){}
</script>
