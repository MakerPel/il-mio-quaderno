<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a64d4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Il mio quaderno">
<meta name="description" content="Esercizi di informatica: mouse, tastiera, copia e incolla, Word ed Excel.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="../icon-192.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Quaderno di informatica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f9fe; --grid:#e1e8f6; --card:#ffffff; --line:#cdd7ec;
  --ink:#1d2b4f; --muted:#56627f;
  --blue:#2a64d4; --pink:#d6336c; --yellow:#ffd43b; --green:#2b9348; --box:#8cc63f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana",system-ui,sans-serif;
  color-scheme:light;
  /* layout: indice a schede raggruppate → foglio d'esercizio con tastierino fisso in basso */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--card);border-bottom:2px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;margin-right:auto}
.levels{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px}
.levels button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted);min-height:42px}
.levels button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stars{font-family:var(--display);font-weight:800;font-size:22px;color:#8a6400;background:#fff3c2;border:2px solid #f1d572;border-radius:999px;padding:2px 14px;font-variant-numeric:tabular-nums}
.stars.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.stars.pop{animation:none}}
.hublink{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.ghost{border:2px solid var(--line);background:var(--paper);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 32px}
.wrap{max-width:1000px;margin:0 auto}

/* indice */
.intro{max-width:62ch;color:var(--muted);margin:4px 0 8px;line-height:1.5}
.group h2{font-family:var(--display);font-size:20px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:150px;box-shadow:0 4px 0 var(--line)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.glyph{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;padding:8px 12px;border-radius:10px;background:var(--paper);border:2px dashed var(--line);white-space:nowrap}
.tile b{font-family:var(--display);font-size:20px;line-height:1.15;margin-top:4px}
.tile span{color:var(--muted);font-size:15px;line-height:1.35}

/* foglio */
.sheet{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 0 var(--line)}
.kicker{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sheet h1{font-family:var(--display);font-size:28px;line-height:1.1;margin:2px 0 6px;text-wrap:balance}
.consegna{font-weight:700;text-transform:uppercase;margin:0 0 16px;color:var(--muted);line-height:1.45;font-size:16px}
.q{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin:12px 0;font-weight:700;text-transform:uppercase;line-height:1.4}
.slot{min-width:72px;height:56px;border:3px solid var(--box);border-radius:10px;background:#fff;font-family:var(--display);font-size:28px;font-weight:800;padding:0 8px;font-variant-numeric:tabular-nums;line-height:1}
.slot.on{border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
.slot.ok{border-color:var(--green);background:#e6f5ea}
.slot.no{border-color:var(--pink);background:#fde7ef}
.given{min-width:56px;height:56px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;font-weight:800}
.eq{display:flex;align-items:flex-start;gap:8px 10px;flex-wrap:wrap;margin:18px 0 6px;padding:14px;background:var(--paper);border-radius:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.col small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;max-width:90px}
.op{font-family:var(--display);font-size:32px;font-weight:800;height:56px;display:inline-flex;align-items:center}
.op.small{font-size:18px;text-transform:uppercase;color:var(--muted)}
.choice{display:inline-flex;gap:8px;flex-wrap:wrap;border-radius:14px;padding:3px}
.choice.ok{box-shadow:0 0 0 3px var(--green)}
.choice.no{box-shadow:0 0 0 3px var(--pink)}
.chip{min-height:50px;min-width:50px;padding:0 16px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:18px}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}

/* divisione */
.field{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:2px dashed var(--line);border-radius:14px;margin-bottom:8px}
.obj{width:58px;height:58px;border-radius:14px;border:2px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.obj.pending{border-color:var(--blue);background:#e3ecfd}
.obj.grouped{border-color:#0002}
.obj svg{width:44px;height:44px}

/* incroci */
.hit{fill:transparent;cursor:pointer}
.mark{fill:var(--pink);pointer-events:none;display:none}
.mark.on{display:block}
svg.board{width:100%;height:auto;display:block;touch-action:manipulation}

/* numeri relativi */
.expr{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:.02em;text-transform:none}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cmprow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--paper);border-radius:14px}
.num{font-family:var(--display);font-size:30px;font-weight:800;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.sym .chip{font-family:var(--display);font-size:26px;padding:0;width:50px}
.pair .chip{font-family:var(--display);font-size:28px;min-width:96px;height:64px;border-width:3px}
.pair .chip.sel{background:var(--yellow);color:var(--ink);border-color:#d9aa00}
.neg{color:var(--pink)} .pos{color:var(--blue)}

/* codice */
.word{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px}
.lcell{display:flex;flex-direction:column;align-items:center;gap:4px}
.lcell .lab{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap;min-height:26px}
.gap{width:26px}
.lslot{width:56px;height:60px;border:3px solid var(--box);border-radius:10px;background:#fff;font-family:var(--display);font-size:32px;font-weight:800}
.lslot.on{border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
.lslot.ok{border-color:var(--green);background:#e6f5ea}
.lslot.no{border-color:var(--pink);background:#fde7ef}
.ctable{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px}
@media (max-width:700px){.ctable{grid-template-columns:repeat(7,minmax(0,1fr))}}
.ccell{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border:2px solid var(--line);border-radius:10px;background:#fff}
.ccell .n{font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.ccell b{font-family:var(--display);font-size:22px}

/* frazioni */
.fracrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.figbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;border-radius:14px;border:3px solid transparent}
.figbox.ok{border-color:var(--green)} .figbox.no{border-color:var(--pink)}
.part{fill:#fff;stroke:var(--ink);stroke-width:2;cursor:pointer}
.part.on{fill:#79aaf7}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.frac>span:first-child{border-bottom:3px solid var(--ink);padding:0 6px 2px;min-width:40px;text-align:center}
.frac .slot{height:48px;min-width:56px;font-size:24px;margin-bottom:4px}
.bigop{font-family:var(--display);font-size:40px;font-weight:800}

/* piano */
.pts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:10px}
.next{padding:10px 14px;border-radius:12px;background:#e3ecfd;font-weight:700;margin:8px 0 4px}

/* collega */
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
.mcol{display:flex;flex-direction:column;gap:10px}
.pic,.nm{position:relative;border:3px solid var(--line);background:#fff;border-radius:14px;min-height:96px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px}
.pic svg{width:84px;height:84px}
.nm{font-weight:700;text-transform:uppercase;font-size:18px}
.pic.sel,.nm.sel{border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
.pic.no{border-color:var(--pink)!important;background:#fde7ef}
.pic.ok{border-color:var(--green)!important;background:#e6f5ea}
.badge{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-family:var(--display);display:flex;align-items:center;justify-content:center;font-size:17px}


/* nuovi esercizi */
.card{background:var(--paper);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcq{margin:4px 0}
.mcq .q{margin:6px 0}
.givens{font-family:var(--display);font-weight:800;font-size:22px;display:grid;gap:2px;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hint{color:#6b5200;font-size:15px;font-weight:700;background:#fff3c2;padding:8px 12px;border-radius:10px;display:inline-block;margin:4px 0 8px;line-height:1.4}
.alg{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:28px;text-transform:none}
.alg.big{font-size:30px;line-height:1.4;margin-bottom:4px;overflow-wrap:anywhere}
.nbox{border:2px solid var(--line);border-radius:10px;padding:2px 12px;background:#fff}
.field.mini{border-style:solid;padding:8px;margin:0;max-width:340px}
.field.bad{border-color:var(--pink);background:#fde7ef}
.addrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.obj.still{width:48px;height:48px}
.obj.cut{position:relative}
.obj.cut::after{content:"";position:absolute;inset:4px;background:linear-gradient(45deg,transparent 44%,#d6336c 44%,#d6336c 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#d6336c 44%,#d6336c 56%,transparent 56%)}
.flab{font-family:var(--display);font-size:24px}
.next.bad{background:#fde7ef;color:var(--pink)}

/* accesso e insegnante */
.who{font-size:15px;white-space:pre}
.loginwrap{display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto}
.hero{font-family:var(--display);font-size:clamp(30px,5vw,44px);line-height:1.05;margin:8px 0 4px;text-wrap:balance}
.logingrid.one{grid-template-columns:minmax(0,620px)}
.roster-in[hidden]{display:none}
.btn.small{min-height:44px;padding:0 14px;font-size:16px}
.logingrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.login{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);gap:12px;padding:20px}
.login h2{font-family:var(--display);font-size:24px;margin:0}
.login h3{font-family:var(--display);font-size:19px;margin:0;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;color:var(--muted)}
.fld input{font:inherit;font-size:22px;font-weight:700;color:var(--ink);padding:10px 14px;border:3px solid var(--line);border-radius:12px;background:#fff;min-height:54px;-webkit-user-select:text;user-select:text}
.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px #2a64d433}
#l-cod,#r-cod{text-transform:uppercase;letter-spacing:.15em;font-family:var(--display)}
.err{color:var(--pink);font-weight:700;margin:0;min-height:1.2em}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;text-decoration:underline;align-self:flex-start;min-height:44px;padding:0}
.codebox{display:inline-flex;align-items:center;gap:14px;background:#fff3c2;border:2px dashed #e0b400;border-radius:14px;padding:10px 16px;margin:8px 0 14px;flex-wrap:wrap}
.codebox span{font-weight:700;color:#6b5200}
.codebox b{font-family:var(--display);font-size:34px;letter-spacing:.18em}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpis div{background:var(--paper);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;min-width:120px}
.kpis b{font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{color:var(--muted);font-weight:700;font-size:14px}
.tablewrap{overflow-x:auto}
table.rep{width:100%;border-collapse:collapse;font-size:16px}
.rep th{text-align:left;font-size:13px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
.rep td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rep td.n{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.rep.small td{padding:6px 8px;font-size:15px}.rep.small td.n{font-size:17px}
.bar{display:inline-flex;align-items:center;gap:8px;min-width:140px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--green);min-width:2px}
.bar em{font-style:normal;font-weight:800;font-family:var(--display)}
.det td{background:var(--paper)}
.detbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:6px 0}
.danger{color:var(--pink);border-color:#f3b6c8}

/* euro */
.purse{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:2px dashed var(--line);border-radius:14px;min-height:74px;background:#fff}
.purse.tray{border-style:solid;background:var(--paper);margin-top:6px}
.purse.pay.ok{border:3px solid var(--green);background:#e6f5ea}
.purse.pay.no{border:3px solid var(--pink);background:#fde7ef}
.money{display:block;flex:none}
.mbtn{border:0;background:none;padding:3px;border-radius:10px;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center}
.mbtn:active{transform:scale(.94)}
.ph{color:var(--muted);font-weight:700}
.prod{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:110px;text-align:center}
.emo{font-size:40px;line-height:1.15}
.pname{font-weight:700;text-transform:uppercase;font-size:14px}
.price{font-family:var(--display);font-weight:800;font-size:22px;color:var(--pink);font-variant-numeric:tabular-nums}
.prod.big{border:0;background:none}.prod.big .emo{font-size:76px}.prod.big .pname{font-size:18px}.prod.big .price{font-size:34px}
.flyer{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px;padding:12px;border-radius:14px;background:#fff6d8;border:2px solid #f1d572}
.rows{display:flex;flex-direction:column;gap:12px}
.rowcard{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.cap{color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;width:100%}
.ptext{font-size:19px;line-height:1.5;margin:0 0 6px;max-width:70ch}

/* italiano */
.reading{background:#fffdf6;border:2px solid #efe3c4;border-radius:16px;padding:16px 18px;font-size:20px;line-height:1.65;max-height:70vh;overflow:auto;-webkit-user-select:text;user-select:text}
.reading p{margin:0 0 .6em}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rhead h2{font-family:var(--display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.speak{font-size:16px}
.mcq .q{text-transform:none;font-size:18px}
.card.vf{margin-bottom:10px}.card.vf .q{text-transform:none;margin:0}
.answer{font-size:18px}
.wchip{min-height:48px;padding:0 14px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:19px}
.wchip:disabled{opacity:.3}
.wchip.in{background:#e3ecfd;border-color:var(--blue)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.built{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:8px;border:2px dashed var(--line);border-radius:12px;background:#fff;align-items:center}
.built.ok{border:3px solid var(--green);background:#e6f5ea}.built.no{border:3px solid var(--pink);background:#fde7ef}
.seq{display:flex;flex-direction:column;gap:10px;border-radius:14px;padding:4px}
.seq.ok{box-shadow:0 0 0 3px var(--green)}.seq.no{box-shadow:0 0 0 3px var(--pink)}
.seqcard{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:19px;line-height:1.4;min-height:60px}
.seqcard .num{flex:none;width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px}
.seqcard.on{border-color:var(--blue);background:#eef3ff}.seqcard.on .num{background:var(--blue);color:#fff;border-style:solid;border-color:var(--blue)}
.cloze{margin:0;line-height:2.3}
.blank{min-width:110px;height:42px;vertical-align:middle;border:0;border-bottom:3px solid var(--box);background:#f3f9ea;border-radius:8px 8px 0 0;font:inherit;font-weight:700;padding:0 8px;margin:0 2px}
.blank.on{border-bottom-color:var(--blue);background:#e3ecfd}.blank.ok{border-bottom-color:var(--green);background:#e6f5ea}.blank.no{border-bottom-color:var(--pink);background:#fde7ef}
.word{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.ctx{margin:4px 0;font-size:18px;line-height:1.5}
.ctx mark{background:#fff3c2;padding:0 3px;border-radius:4px;font-weight:700}
.defs{flex-direction:column;align-items:stretch;width:100%}
.defs .chip{text-align:left;padding:10px 14px;line-height:1.35}
.legend{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tg{font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;color:#fff}
.tg.n,.tw.n{background:#2a64d4;color:#fff;border-color:#2a64d4}
.tg.v,.tw.v{background:#d6336c;color:#fff;border-color:#d6336c}
.tg.a,.tw.a{background:#2b9348;color:#fff;border-color:#2b9348}
.tagline{font-size:24px;line-height:2.2;margin:0}
.tw{border:2px solid transparent;background:#f2f5fb;border-radius:10px;padding:2px 8px;font:inherit;font-weight:700;min-height:44px}
.tw.bad{outline:3px solid var(--pink);outline-offset:1px}

/* inglese */
.emo.big{font-size:60px;line-height:1.1}
.say{border:0;background:#e3ecfd;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.enw{font-size:20px}
.col1{flex-direction:column;align-items:stretch;width:100%}
.col1 .chip{text-align:left;padding:8px 14px;line-height:1.3;text-transform:none}
.colours .chip{text-transform:none}
.street{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 12px 34px;background:#eef3ff;border-radius:16px;margin-bottom:10px}
.bld{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:14px;position:relative;z-index:1}
.road{position:absolute;left:0;right:0;bottom:8px;height:16px;background:repeating-linear-gradient(90deg,#9aa6c2 0 26px,#fff 26px 40px);border-radius:4px;opacity:.7}
.postcard{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:14px;border-radius:16px;background:#fff6d8;border:2px dashed #e0b400;margin-bottom:14px}
.pc{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:12px;padding:8px 4px;text-align:center}
.pc .emo{font-size:34px}.pc small{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px}
.letters .wchip,.letters+.bank .wchip{font-family:var(--display);font-size:26px;min-width:50px;text-transform:lowercase}

/* francese */
.seqtxt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.letter{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",var(--body);background:#fffef8;border-color:#e7dcc0}
.letter p{margin:0 0 .35em}
.flagfr{display:flex;width:120px;height:80px;border-radius:8px;overflow:hidden;border:2px solid var(--line);margin:0 0 14px}

/* tedesco */
.bignum{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.art .chip{font-family:var(--display);font-size:22px;min-width:76px;text-transform:none}
.letters.de .wchip,.bank.de .wchip{text-transform:none}
.sech{font-family:var(--display);font-size:24px;margin:0 0 4px}
.roster{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--paper);border-radius:12px;flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.rinfo{display:flex;flex-direction:column;flex:1;min-width:160px}
.rinfo b{font-size:19px}.rinfo small{color:var(--muted);font-weight:700}
.danger.armed{background:var(--pink);color:#fff;border-color:var(--pink)}

/* informatica */
.pcmsg{font-weight:700;color:var(--blue);min-height:1.4em;margin:6px 0 10px}.pcmsg.ok{color:var(--green)}.pcmsg.no{color:var(--pink)}
.tasks{margin:0 0 10px;padding-left:24px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.tasks li{line-height:1.4}.tasks li.done{color:var(--green)}.tasks li.done::after{content:" ✓"}.tasks li.now{color:var(--ink);background:#fff3c2;border-radius:6px;padding:0 6px}
.arena{position:relative;height:min(52vh,420px);border:3px dashed var(--line);border-radius:16px;background:#eef3ff;overflow:hidden;touch-action:manipulation}
.arena.ok{border-color:var(--green);background:#e6f5ea}
.target{position:absolute;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 10px #0002;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:transform .1s}
.target:active{transform:scale(.9)}
.desk{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;padding:16px;background:linear-gradient(135deg,#3a6fd8,#5b8fe6);border-radius:16px;min-height:200px}
.deskwrap{position:relative}
.icon{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:2px solid transparent;border-radius:10px;padding:8px 4px;color:#fff;font-weight:700;font-size:15px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.icon .ico{font-size:44px;line-height:1}.icon.sel{background:#ffffff33;border-color:#fff}.icon.opened{background:#ffffff55}
.ctx{position:absolute;z-index:5;background:#fff;border:1px solid #c9d4ea;border-radius:10px;box-shadow:0 8px 24px #0003;padding:6px;display:flex;flex-direction:column;min-width:170px}
.ctx[hidden]{display:none}
.ctx button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:6px;font-weight:700;font-size:16px}.ctx button:hover,.ctx button:focus{background:#e3ecfd}
.mousepic{width:70px;height:100px;border:3px solid var(--ink);border-radius:35px 35px 30px 30px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:40px 1fr;overflow:hidden;margin:0 0 10px}
.mousepic .mb{height:40px;border-bottom:3px solid var(--ink)}.mousepic .mb.r{background:var(--pink);border-left:3px solid var(--ink);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tray2{display:flex;flex-wrap:wrap;gap:10px;min-height:96px;padding:10px;border:2px dashed var(--line);border-radius:14px;background:#fff;margin-bottom:14px}
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fold{border:3px solid #e0b400;background:#fff6d8;border-radius:14px;min-height:150px;padding:8px}
.fhead{font-family:var(--display);font-weight:800;font-size:20px;margin-bottom:6px}.fin{display:flex;flex-wrap:wrap;gap:8px}
.file{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;min-width:96px}
.file span{font-size:34px;line-height:1}.file small{font-weight:700;font-size:13px}.file.dragging{z-index:20;position:relative;box-shadow:0 10px 24px #0003;cursor:grabbing}
.file.ok{border-color:var(--green);background:#e6f5ea}.file.no{border-color:var(--pink);background:#fde7ef}
kbd{font-family:var(--display);font-weight:800;font-size:22px;background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:8px;padding:2px 10px}
.ribbon{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#f2f5fb;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;align-items:center}
.ribbon.word{background:#e8effc}.rtab{font-weight:800;color:#fff;background:#2a64d4;border-radius:8px;padding:6px 10px;margin-right:4px}
.tbtn{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 8px;font-size:20px;line-height:1.1}
.tbtn small{font-size:11px}.tbtn.small{min-height:44px;font-size:16px}
.editor{width:100%;font:inherit;font-size:20px;line-height:1.6;border:3px solid var(--line);border-radius:12px;padding:12px;background:#fff;-webkit-user-select:text;user-select:text}
.editor.ok{border-color:var(--green)}.editor.no{border-color:var(--pink)}
.model{font-size:24px;font-weight:700;background:#fff3c2;border-radius:10px;padding:8px 12px;margin-bottom:8px;-webkit-user-select:none;user-select:none}
.typein{width:100%;font:inherit;font-size:24px;padding:10px 12px;border:3px solid var(--line);border-radius:12px;-webkit-user-select:text;user-select:text}
.typein.ok{border-color:var(--green);background:#e6f5ea}.typein.no{border-color:var(--pink);background:#fde7ef}.live{color:var(--pink);font-weight:700;min-height:1.2em;display:block;margin-top:4px}
.page{background:#fff;border:1px solid #d5dbe6;box-shadow:0 4px 18px #0001;border-radius:4px;padding:28px 32px;min-height:260px;max-width:760px;margin:0 auto;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif}
.wp{margin:0 0 10px;line-height:1.5}.wt{font-weight:700}.wl{margin:0 0 4px;padding-left:28px}
.ww{cursor:pointer;border-radius:3px;padding:0 1px}.ww.sel{background:#b9d3ff}
table.xl{border-collapse:collapse;font-family:Calibri,Carlito,Arial,sans-serif;font-size:16px;background:#fff}
.xl th{background:#eef1f5;color:#444;font-weight:700;border:1px solid #c9ced6;padding:4px 8px;min-width:34px}
.xl td{border:1px solid #d6dbe3;min-width:96px;height:38px;padding:2px 8px;cursor:cell;white-space:nowrap}
.xl td.hit{outline:3px solid #1e7145;outline-offset:-3px}.xl td.rng{background:#cfe8d9}.xl td.goal{background:#fff3c2}.xl td.bad{background:#fde7ef}.xl td.hd{font-weight:700}
.xlbar{display:flex;align-items:center;gap:8px;margin:8px 0}.namebox{min-width:90px;border:2px solid #c9ced6;border-radius:6px;padding:8px;font-weight:800;text-align:center;background:#fff}
.fx{font-style:italic;font-weight:800;color:#666}.fxin{flex:1;font:inherit;font-size:20px;padding:8px 10px;border:2px solid #1e7145;border-radius:6px;min-width:0;-webkit-user-select:text;user-select:text}
.readbox:empty{display:none}.readbox{margin-bottom:10px}
/* barra in basso */
.dock{background:var(--card);border-top:2px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.keypad{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:6px;max-width:1000px;margin:0 auto 10px}
.keypad button{height:54px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-size:26px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.keypad button:active{transform:translateY(2px);box-shadow:none}
@media (max-width:620px){.keypad{grid-template-columns:repeat(7,minmax(0,1fr))}}
.actions{display:flex;gap:10px;max-width:1000px;margin:0 auto;align-items:center;flex-wrap:wrap}
.btn{min-height:54px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:800;font-family:var(--display);font-size:19px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.fb{flex:1;font-family:var(--display);font-weight:800;font-size:21px;min-width:180px;line-height:1.2}
.fb.ok{color:var(--green)} .fb.no{color:var(--pink)} .fb.info{color:var(--muted)}
[hidden]{display:none!important}

/* blocco in verticale sui dispositivi touch */
.rotate{display:none}
@media (orientation:landscape) and (hover:none) and (pointer:coarse){
  .rotate{display:flex;position:fixed;inset:0;z-index:9999;background:#2a64d4;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
  .rotate .ic{font-size:72px;line-height:1;animation:rot 2s ease-in-out infinite}
  .rotate b{font-size:30px}.rotate span{font-size:18px;opacity:.9;font-family:"Andika",Verdana,sans-serif}
  body{overflow:hidden}
}
@keyframes rot{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.rotate .ic{animation:none}}
</style>
</head>
<body>
<div class="rotate" role="alert" aria-live="assertive"><div class="ic" aria-hidden="true">📱</div><b>Gira il dispositivo in verticale</b><span>Il quaderno si usa tenendo l’iPad in piedi.</span></div>

<div id="app">
  <header class="top">
    <a id="hub" class="ghost hublink" href="../">‹ Il mio quaderno</a>
    <button id="back" class="ghost" type="button" hidden>‹ Indice</button>
    <div class="brand">Quaderno di informatica</div>
    <div class="levels" role="group" aria-label="Livello" id="levels"></div>
    <div class="stars" id="stars" title="Stelle guadagnate">★ 0</div>
    <button id="who" class="ghost who" type="button" hidden></button>
  </header>
  <main id="main"><div class="wrap" id="view"></div></main>
  <div class="dock" id="dock" hidden>
    <div class="keypad" id="keypad"></div>
    <div class="actions">
      <div class="fb" id="fb" aria-live="polite"></div>
      <button class="btn" id="bSol" type="button">Soluzione</button>
      <button class="btn" id="bNew" type="button">Nuovo esercizio</button>
      <button class="btn primary" id="bChk" type="button">Controlla</button>
    </div>
  </div>
</div>
<script>
/* ---------- utilità ---------- */
const NS='http://www.w3.org/2000/svg';
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;}
function s(tag,attrs,...kids){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs||{})){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sg=n=>n>0?'+'+n:n<0?'−'+(-n):'0';
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const opTxt=d=>(d>0?' + ':' − ')+Math.abs(d);
function load(k,d){try{const v=localStorage.getItem('qm-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem('qm-'+k,JSON.stringify(v));}catch(e){}}
const row=(text,...ctrl)=>h('div',{class:'q'},h('span',{},text),...ctrl);
const col=(el,label)=>h('div',{class:'col'},el,label?h('small',{},label):null);
const op=t=>h('span',{class:'op'},t);
const given=t=>h('span',{class:'given'},t);
const GC=['#ffe08a','#b9e4c9','#c8d9ff','#ffc9d9','#e2d1ff','#ffd7b0','#c4f0f0','#e8e8a8','#f7c8f0'];
const PC=['#2a64d4','#d6336c','#2b9348','#b8650b','#7b3fc4'];

/* ---------- caselle numeriche e scelte ---------- */
let active=null;
function slot(ans){const b=h('button',{class:'slot',type:'button','aria-label':'casella da riempire'});b.dataset.v='';b.ans=ans;b.addEventListener('click',()=>focusSlot(b));return b;}
function focusSlot(b){if(active)active.classList.remove('on');active=b;if(b){b.classList.add('on');b.classList.remove('ok','no');}}
function setSlot(b,v){b.dataset.v=v;b.textContent=v.replace('-','−');b.classList.remove('ok','no');}
function keyPress(k){
  if(!cur)return;
  if(!active||!cur.el.contains(active)){const f=[...cur.el.querySelectorAll('.slot')].find(x=>x.dataset.v==='');if(!f)return;focusSlot(f);}
  let v=active.dataset.v;
  if(k==='back')v=v.slice(0,-1);
  else if(k==='neg')v=v.startsWith('-')?v.slice(1):'-'+v;
  else if(k==='comma'){if(v.includes(','))return;v=(v===''||v==='-')?v+'0,':v+',';}
  else{if(v.replace(/[-,]/g,'').length>=7)return;v=(v==='0'||v==='-0')?v.replace('0','')+k:v+k;}
  setSlot(active,v);
}
function checkSlots(root){let ok=true;root.querySelectorAll('.slot').forEach(b=>{const v=b.dataset.v;const x=Number(v.replace(',','.'));const good=v!==''&&v!=='-'&&!isNaN(x)&&Math.abs(x-b.ans)<0.001;b.classList.toggle('ok',good);b.classList.toggle('no',!good);b.classList.remove('on');if(!good)ok=false;});return ok;}
function solveSlots(root){root.querySelectorAll('.slot').forEach(b=>{setSlot(b,fmt(b.ans));b.classList.add('ok');});}
function choices(opts,ans,cls){const g=h('div',{class:'choice '+(cls||''),role:'group'});g.ans=ans;g.val=null;opts.forEach(o=>{const b=h('button',{type:'button',class:'chip'},o);b.addEventListener('click',()=>{g.val=o;g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===b));g.classList.remove('ok','no');});g.append(b);});return g;}
function checkChoices(root){let ok=true;root.querySelectorAll('.choice').forEach(g=>{const good=g.val===g.ans;g.classList.toggle('ok',good);g.classList.toggle('no',!good);if(!good)ok=false;});return ok;}
function solveChoices(root){root.querySelectorAll('.choice').forEach(g=>{g.val=g.ans;g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x.textContent===g.ans));g.classList.add('ok');g.classList.remove('no');});}
const checkAll=root=>{const a=checkSlots(root),b=checkChoices(root);return a&&b;};
const solveAll=root=>{solveSlots(root);solveChoices(root);};

/* ---------- utilità ---------- */
const mcq=(q,opts,ans)=>h('div',{class:'mcq'},h('div',{class:'q'},q),choices(opts,ans));
const wordOpts=(ans,others,n=2)=>shuffle([ans,...shuffle([...new Set(others)].filter(x=>x!==ans)).slice(0,n)]);
const card=(...k)=>h('div',{class:'card'},...k);
const autoCheck=()=>setTimeout(()=>{const b=document.getElementById('bChk');if(b)b.click();},250);
function taskList(items){const ul=h('ol',{class:'tasks'});const lis=items.map(t=>{const li=h('li',{},t);ul.append(li);return li;});
  return{el:ul,set(i,st){lis.forEach((li,k)=>{li.classList.toggle('done',k<i||(st==='all'));li.classList.toggle('now',k===i&&st!=='all');});}};}
const say=(el,txt,cls='')=>{el.textContent=txt;el.className='pcmsg '+cls;};

/* ---------- esercizi di informatica ---------- */
const GROUPS=['Il mouse','Tastiera, copia e incolla','Word','Excel'];
const EX=[
/* 1 — clic */
{id:'pc-clic',g:0,title:'Acchiappa le stelline',desc:'Gioco: fai clic (o tocca) le stelline appena compaiono.',glyph:'🖱️ ⭐',
make(L){
  const N=[8,12,16][L],S=[84,60,42][L];let got=0,done=false,t0=0;
  const arena=h('div',{class:'arena'});const star=h('button',{type:'button',class:'target','aria-label':'stellina'},'⭐');star.style.width=star.style.height=S+'px';star.style.fontSize=(S*0.62)+'px';
  const info=h('div',{class:'pcmsg'},`Prese: 0 su ${N}`);
  function place(){const w=arena.clientWidth||600,hh=arena.clientHeight||380;star.style.left=Math.round(Math.random()*(w-S))+'px';star.style.top=Math.round(Math.random()*(hh-S))+'px';}
  star.addEventListener('click',()=>{if(done)return;if(!got)t0=Date.now();got++;say(info,`Prese: ${got} su ${N}`);
    if(got>=N){done=true;star.hidden=true;arena.classList.add('ok');say(info,`Bravo! Le hai prese tutte in ${Math.round((Date.now()-t0)/1000)} secondi.`,'ok');autoCheck();}else place();});
  arena.append(star);setTimeout(place,30);
  const el=h('div');el.append(h('p',{class:'consegna'},`Muovi il mouse sulla stellina e fai clic con il tasto sinistro. Sull’iPad toccala con il dito. Prendine ${N}!`),info,arena);
  return{el,check:()=>done,solve(){done=true;star.hidden=true;arena.classList.add('ok');say(info,'Fatto!','ok');}};
}},
/* 2 — doppio clic */
{id:'pc-doppio',g:0,title:'Il doppio clic',desc:'Apri le cartelle giuste con il doppio clic.',glyph:'📁 ×2',
make(L){
  const NAMES=['Compiti','Foto','Musica','Giochi','Scuola','Disegni','Video','Ricette','Vacanze'];const names=shuffle(NAMES).slice(0,6);const targets=shuffle(names).slice(0,[2,3,4][L]);let k=0,done=false;
  const tl=taskList(targets.map(n=>`Apri la cartella «${n}»`));tl.set(0);
  const info=h('div',{class:'pcmsg'},'Un clic seleziona la cartella. Due clic veloci la aprono.');
  const desk=h('div',{class:'desk'});const btns={};
  names.forEach(n=>{const b=h('button',{type:'button',class:'icon'},h('span',{class:'ico'},'📁'),h('span',{},n));btns[n]=b;let last=0;
    const open=()=>{if(done)return;if(n===targets[k]){b.querySelector('.ico').textContent='📂';b.classList.add('opened');k++;tl.set(k);
        if(k>=targets.length){done=true;tl.set(k,'all');say(info,'Perfetto! Hai aperto tutte le cartelle.','ok');autoCheck();}else say(info,`Bene! Ora apri «${targets[k]}».`,'ok');}
      else say(info,`Hai aperto «${n}», ma la cartella da aprire è «${targets[k]}».`,'no');};
    b.addEventListener('click',()=>{const now=Date.now();Object.values(btns).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(now-last<450){last=0;open();}else{last=now;if(!b.classList.contains('opened'))say(info,`Hai selezionato «${n}». Per aprirla fai doppio clic.`);}});
    desk.append(b);});
  const el=h('div');el.append(h('p',{class:'consegna'},'Fai doppio clic (due clic veloci con il tasto sinistro) sulle cartelle, nell’ordine della lista. Sull’iPad tocca due volte veloce.'),tl.el,info,desk);
  return{el,check:()=>done,solve(){done=true;targets.forEach(n=>{btns[n].querySelector('.ico').textContent='📂';btns[n].classList.add('opened');});tl.set(targets.length,'all');say(info,'Fatto!','ok');}};
}},
/* 3 — trascina */
{id:'pc-trascina',g:0,title:'Trascina e rilascia',desc:'Gioco: trascina ogni file nella cartella giusta.',glyph:'📄 → 📁',
make(L){
  const F={Documenti:[['📄','tema.docx'],['📄','lettera.docx'],['📄','ricerca.docx'],['📄','poesia.docx']],Immagini:[['🖼️','mare.jpg'],['🖼️','gatto.png'],['🖼️','disegno.png'],['🖼️','gita.jpg']],Musica:[['🎵','canzone.mp3'],['🎵','inno.mp3'],['🎵','flauto.mp3']]};

  const tray=h('div',{class:'tray2'});const boxes={};
  const zone=h('div',{class:'folders'},cats.map(c=>{const inner=h('div',{class:'fin'});const b=h('div',{class:'fold','data-c':c},h('div',{class:'fhead'},'📁 '+c),inner);boxes[c]=inner;return b;}));
  const items=files.map(f=>{const it=h('div',{class:'file',tabindex:'0'},h('span',{},f.e),h('small',{},f.n));it.f=f;it.where=null;tray.append(it);drag(it);return it;});
  function drag(it){let sx=0,sy=0,dragging=false;
    it.addEventListener('pointerdown',e=>{dragging=true;it.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;it.classList.add('dragging');it.classList.remove('ok','no');});
    it.addEventListener('pointermove',e=>{if(!dragging)return;it.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px)`;});
    const end=e=>{if(!dragging)return;dragging=false;it.classList.remove('dragging');it.style.transform='';it.style.visibility='hidden';const under=document.elementFromPoint(e.clientX,e.clientY);it.style.visibility='';
      const fold=under&&under.closest('.fold');if(fold){boxes[fold.dataset.c].append(it);it.where=fold.dataset.c;}else if(under&&under.closest('.tray2')){tray.append(it);it.where=null;}};
    it.addEventListener('pointerup',end);it.addEventListener('pointercancel',end);}
  const el=h('div');el.append(h('p',{class:'consegna'},'Tieni premuto il tasto sinistro sul file, trascinalo sopra la cartella giusta e lascia il tasto. Sull’iPad tieni il dito sul file e spostalo.'),
    h('div',{class:'kicker'},'I file da sistemare'),tray,zone);
  return{el,check(){let ok=true;items.forEach(it=>{const g=it.where===it.f.c;it.classList.toggle('ok',g);it.classList.toggle('no',!g);if(!g)ok=false;});return ok;},
    solve(){items.forEach(it=>{boxes[it.f.c].append(it);it.where=it.f.c;it.classList.add('ok');it.classList.remove('no');});}};
}},

{id:'pc-destro',g:0,title:'Il tasto destro',desc:'Apri il menu con il tasto destro e scegli il comando giusto.',glyph:'🖱️ ▸ menu',
make(L){

  const fl=shuffle(FILES).slice(0,4);const tasks=shuffle(fl).slice(0,[2,3,4][L]).map(f=>({f,a:pick(['Apri','Copia','Rinomina','Elimina','Taglia'])}));let k=0,done=false;
  const tl=taskList(tasks.map(t=>`Fai clic con il tasto destro su «${t.f[1]}» e scegli «${t.a}»`));tl.set(0);
  const info=h('div',{class:'pcmsg'},'Il tasto destro apre un menu con i comandi. Sull’iPad tieni il dito premuto sul file.');
  const desk=h('div',{class:'desk'});const menu=h('div',{class:'ctx',hidden:true,role:'menu'});let cur2=null;
  ACT.forEach(a=>{const b=h('button',{type:'button',role:'menuitem'},a);b.addEventListener('click',()=>{menu.hidden=true;choose(a);});menu.append(b);});
  function choose(a){if(done||!cur2)return;const t=tasks[k];if(cur2===t.f[1]&&a===t.a){k++;tl.set(k);if(k>=tasks.length){done=true;tl.set(k,'all');say(info,'Bravissimo! Sai usare il tasto destro.','ok');autoCheck();}else say(info,'Giusto! Vai avanti con la lista.','ok');}
    else say(info,`Hai scelto «${a}» su «${cur2}». Controlla la lista e riprova.`,'no');}
  function openMenu(name,x,y){cur2=name;const r=wrap.getBoundingClientRect();menu.style.left=Math.min(x-r.left,r.width-180)+'px';menu.style.top=(y-r.top)+'px';menu.hidden=false;}
  fl.forEach(f=>{const b=h('button',{type:'button',class:'icon'},h('span',{class:'ico'},f[0]),h('span',{},f[1]));
    b.addEventListener('contextmenu',e=>{e.preventDefault();openMenu(f[1],e.clientX,e.clientY);});
    let lp=null;b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const x=e.clientX,y=e.clientY;lp=setTimeout(()=>openMenu(f[1],x,y),550);});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(lp)));
    b.addEventListener('click',()=>{if(menu.hidden)say(info,'Questo è un clic sinistro: per il menu serve il tasto destro.');});
    desk.append(b);});
  const wrap=h('div',{class:'deskwrap'},desk,menu);wrap.addEventListener('click',e=>{if(!e.target.closest('.ctx')&&!e.target.closest('.icon'))menu.hidden=true;});
  const el=h('div');el.append(h('p',{class:'consegna'},'Con il tasto destro del mouse si apre un menu. Segui la lista.'),
    h('div',{class:'mousepic','aria-hidden':'true'},h('span',{class:'mb'},''),h('span',{class:'mb r'},'destro')),tl.el,info,wrap);
  return{el,check:()=>done,solve(){done=true;tl.set(tasks.length,'all');say(info,'Fatto!','ok');}};
}},

{id:'pc-copiaincolla',g:1,title:'Copia, taglia e incolla',desc:'Usa Copia, Taglia e Incolla per sistemare il testo.',glyph:'✂️ 📋',
make(L){
  const NAMES=['Luca','Sara','Marta','Paolo','Giulia'];const nm=pick(NAMES);let start,target,consegna;
  const kind=L===0?'copia':L===1?'sposta':pick(['sposta','parola']);
  if(kind==='copia'){const f=pick([`Ciao ${nm}!`,'Buon compleanno!','Viva la scuola!','Evviva le vacanze!']);start=f;target=[f,f,f].join('\n');consegna=`Seleziona la frase «${f}», premi COPIA, poi vai a capo e premi INCOLLA. Alla fine la frase deve essere scritta 3 volte, una per riga.`;}
  else if(kind==='sposta'){const LISTS=[['lunedì','martedì','mercoledì','giovedì','venerdì'],['gennaio','febbraio','marzo','aprile','maggio'],['uno','due','tre','quattro','cinque'],['mattina','pomeriggio','sera','notte']];
    const lst=pick(LISTS).slice(0,L===2?4:3);let sh;do{sh=shuffle(lst);}while(sh.join()===lst.join());start=sh.join('\n');target=lst.join('\n');
    consegna='Le righe sono in disordine. Seleziona una riga, premi TAGLIA, metti il cursore nel posto giusto e premi INCOLLA. Metti tutte le righe nell’ordine giusto.';}
  else{const P=[['estate','In estate andiamo al mare.','Mi piace l’… perché fa caldo.'],['gelato','Oggi la nonna mi compra un gelato.','Il … alla fragola è il mio preferito.'],['biblioteca','Domani andiamo in biblioteca.','In … ci sono tanti libri.']];
    const p=pick(P);start=p[1]+'\n'+p[2];target=p[1]+'\n'+p[2].replace('…',p[0]);consegna=`Seleziona la parola «${p[0]}» nella prima frase, premi COPIA, poi seleziona i puntini «…» nella seconda frase e premi INCOLLA.`;}
  let clip='';const hist=[];
  const ta=h('textarea',{class:'editor',rows:'6',spellcheck:'false','aria-label':'Il foglio di testo'});ta.value=start;
  const msg=h('div',{class:'pcmsg'},'Suggerimento: per selezionare, tieni premuto il tasto sinistro e trascina sopra le parole (sull’iPad: tocco lungo).');
  const push=()=>{hist.push(ta.value);if(hist.length>40)hist.shift();};
  const tool=(lab,ic,fn)=>{const b=h('button',{type:'button',class:'tbtn'},h('span',{},ic),h('small',{},lab));b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{fn();ta.focus();});return b;};
  const sel=()=>[ta.selectionStart,ta.selectionEnd];
  const bar=h('div',{class:'ribbon'},
    tool('Taglia','✂️',()=>{const[a,b]=sel();if(a===b){say(msg,'Prima seleziona il testo da tagliare.','no');return;}push();clip=ta.value.slice(a,b);ta.value=ta.value.slice(0,a)+ta.value.slice(b);ta.setSelectionRange(a,a);say(msg,`Tagliato: «${clip}». Ora metti il cursore dove vuoi e premi Incolla.`);}),
    tool('Copia','📋',()=>{const[a,b]=sel();if(a===b){say(msg,'Prima seleziona il testo da copiare.','no');return;}clip=ta.value.slice(a,b);try{navigator.clipboard&&navigator.clipboard.writeText(clip).catch(()=>{});}catch(e){}say(msg,`Copiato: «${clip}».`);}),
    tool('Incolla','📥',()=>{if(!clip){say(msg,'Gli appunti sono vuoti: prima copia o taglia qualcosa.','no');return;}const[a,b]=sel();push();ta.value=ta.value.slice(0,a)+clip+ta.value.slice(b);const p=a+clip.length;ta.setSelectionRange(p,p);say(msg,'Incollato!');}),
    tool('Annulla','↶',()=>{if(!hist.length)return;ta.value=hist.pop();say(msg,'Ho annullato l’ultima azione.');}),
    tool('Ricomincia','🔄',()=>{push();ta.value=start;clip='';say(msg,'Testo rimesso come all’inizio.');}));
  ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['x','v','z'].includes(e.key.toLowerCase()))push();});
  const norm=s=>s.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean).join('\n');
  const el=h('div');el.append(h('p',{class:'consegna'},consegna),bar,ta,msg,h('p',{class:'hint'},'Con la tastiera: Ctrl + X taglia, Ctrl + C copia, Ctrl + V incolla, Ctrl + Z annulla.'));
  return{el,check(){const ok=norm(ta.value)===norm(target);ta.classList.toggle('ok',ok);ta.classList.toggle('no',!ok);if(!ok)say(msg,'Non è ancora giusto. Controlla l’ordine e le righe.','no');return ok;},
    solve(){ta.value=target;ta.classList.add('ok');ta.classList.remove('no');}};
}},

{id:'pc-word',g:2,title:'Formatta come in Word',desc:'Seleziona le parole e usa i pulsanti G, C, S, colore, dimensione e allineamento.',glyph:'G C S',
make(L){
  const DOCS=[{t:'Il mio animale',p:['Il mio gatto si chiama Luna.','Ha il pelo nero e gli occhi verdi.','Ama dormire sul divano.']},
    {t:'La gita al mare',p:['Domenica siamo andati al mare con la scuola.','Abbiamo fatto il bagno e mangiato un gelato.']},
    {t:'La lista della spesa',p:['Oggi devo comprare:','pane','latte','mele','biscotti'],list:[1,4]},
    {t:'Il mio compleanno',p:['Sabato compio dieci anni.','Faccio una festa con tutti i miei amici.','La torta sarà al cioccolato.']}];
  const doc=L===2&&Math.random()<.5?DOCS[2]:pick(DOCS.filter(d=>!d.list));
  const paras=[{words:doc.t.split(' '),title:true}].concat(doc.p.map(x=>({words:x.split(' ')})));
  const P=paras.map((p,pi)=>({pi,title:!!p.title,align:'left',list:false,size:p.title?2:1,words:p.words.map(w=>({w,b:false,i:false,u:false,col:'',sel:false}))}));
  const body=P.slice(1).flatMap(p=>p.words.filter(x=>/^[A-Za-zÀ-ú]{4,}$/.test(x.w.replace(/[.,:!?]/g,''))));
  const pickW=()=>{const w=pick(body.filter(x=>!x.used));w.used=true;return w;};
  const T=[];const add=(txt,test,apply)=>T.push({txt,test,apply});
  const fmt=[['b','Metti in grassetto (G)'],['i','Scrivi in corsivo (C)'],['u','Sottolinea (S)']];
  shuffle(fmt).slice(0,[2,2,2][L]).forEach(([k,lab])=>{const w=pickW();add(`${lab} la parola «${w.w.replace(/[.,:!?]/g,'')}»`,()=>w[k],()=>{w[k]=true;});});
  if(L>=1){const w=pickW();const c=pick([['red','rosso'],['blue','blu'],['green','verde']]);add(`Colora di ${c[1]} la parola «${w.w.replace(/[.,:!?]/g,'')}»`,()=>w.col===c[0],()=>{w.col=c[0];});
    add('Centra il titolo',()=>P[0].align==='center',()=>{P[0].align='center';});}
  if(L===2){if(doc.list)add('Fai un elenco puntato con le cose da comprare (da «pane» a «biscotti»)',()=>P.slice(doc.list[0]+1,doc.list[1]+2).every(p=>p.list),()=>P.slice(doc.list[0]+1,doc.list[1]+2).forEach(p=>p.list=true));
    else add('Ingrandisci il titolo (premi A+ almeno una volta)',()=>P[0].size>=3,()=>{P[0].size=3;});}
  const page=h('div',{class:'page'});const tl=h('ol',{class:'tasks'});
  function render(){page.replaceChildren(...P.map(p=>{const el=h(p.list?'li':'p',{class:'wp'+(p.title?' wt':''),style:`text-align:${p.align};font-size:${[0,18,24,32,40][p.size]}px`});
      p.words.forEach((x,i)=>{const s=h('span',{class:'ww'+(x.sel?' sel':''),style:`${x.b?'font-weight:800;':''}${x.i?'font-style:italic;':''}${x.u?'text-decoration:underline;':''}${x.col?'color:'+x.col+';':''}`},x.w);
        s.addEventListener('click',()=>{x.sel=!x.sel;render();});el.append(s,i<p.words.length-1?' ':'');});
      return p.list?h('ul',{class:'wl'},el):el;}));
    tl.replaceChildren(...T.map(t=>h('li',{class:t.test()?'done':''},t.txt)));}
  const selW=()=>P.flatMap(p=>p.words).filter(x=>x.sel);const selP=()=>P.filter(p=>p.words.some(x=>x.sel));
  const msg=h('div',{class:'pcmsg'},'Tocca (o fai clic) sulle parole per selezionarle: diventano azzurre. Poi premi un pulsante.');
  const need=f=>()=>{const s=selW();if(!s.length){say(msg,'Prima seleziona almeno una parola.','no');return;}f(s);render();};
  const tog=k=>need(s=>{const v=!s.every(x=>x[k]);s.forEach(x=>x[k]=v);});
  const tb=(lab,title,fn,cls='')=>{const b=h('button',{type:'button',class:'tbtn '+cls,title,'aria-label':title},lab);b.addEventListener('click',fn);return b;};
  const pNeed=f=>()=>{const ps=selP();if(!ps.length){say(msg,'Prima seleziona una parola della riga.','no');return;}ps.forEach(f);render();};
  const ribbon=h('div',{class:'ribbon word'},h('span',{class:'rtab'},'Home'),
    tb(h('b',{},'G'),'Grassetto',tog('b')),tb(h('i',{},'C'),'Corsivo',tog('i')),tb(h('u',{},'S'),'Sottolineato',tog('u')),
    tb(h('span',{style:'color:red;font-weight:800'},'A'),'Colore rosso',need(s=>s.forEach(x=>x.col='red'))),tb(h('span',{style:'color:blue;font-weight:800'},'A'),'Colore blu',need(s=>s.forEach(x=>x.col='blue'))),tb(h('span',{style:'color:green;font-weight:800'},'A'),'Colore verde',need(s=>s.forEach(x=>x.col='green'))),
    tb('A+','Aumenta dimensione',pNeed(p=>{p.size=Math.min(4,p.size+1);})),tb('A−','Riduci dimensione',pNeed(p=>{p.size=Math.max(1,p.size-1);})),
    tb('⇤','Allinea a sinistra',pNeed(p=>p.align='left')),tb('↔','Allinea al centro',pNeed(p=>p.align='center')),tb('⇥','Allinea a destra',pNeed(p=>p.align='right')),
    tb('•≡','Elenco puntato',pNeed(p=>{p.list=!p.list;})),tb('✕','Togli selezione',()=>{P.forEach(p=>p.words.forEach(x=>x.sel=false));render();}));
  render();
  const el=h('div');el.append(h('p',{class:'consegna'},'Come in Word: prima selezioni le parole, poi scegli il pulsante. Segui la lista.'),tl,ribbon,msg,page);
  return{el,check(){render();const ok=T.every(t=>t.test());if(!ok)say(msg,'Mancano ancora delle cose della lista (quelle senza ✓).','no');return ok;},solve(){T.forEach(t=>t.apply());P.forEach(p=>p.words.forEach(x=>x.sel=false));render();}};
}},

{id:'pc-excel-celle',g:3,title:'Le celle di Excel',desc:'Trova le celle: colonne con le lettere, righe con i numeri.',glyph:'B3',

  const cells={};const tasks=[];const used=new Set();
  const rc=()=>{let a;do{a=C[rnd(0,5)]+rnd(1,R);}while(used.has(a));used.add(a);return a;};
  for(let i=0;i<[4,4,3][L];i++){const a=rc();tasks.push({t:`Fai clic sulla cella ${a}`,type:'cell',a});}
  if(L>=1){const a=Object.keys(vals).filter(x=>!used.has(x))[0];if(a){used.add(a);tasks.push({t:`Che cosa c’è scritto nella cella ${a}?`,type:'read',a,ans:vals[a]});}}

  const readBox=h('div',{class:'readbox'});
  function next(){k++;tl.set(k);rangeStart=null;Object.values(cells).forEach(x=>x.classList.remove('rng','hit'));showRead();

  function showRead(){readBox.replaceChildren();const t=tasks[k];if(!t||t.type!=='read')return;const opts=wordOpts(t.ans,Object.values(vals),2);
    readBox.append(h('div',{class:'q',style:'text-transform:none'},t.t),h('div',{class:'choice'},opts.map(o=>{const b=h('button',{type:'button',class:'chip'},o);b.addEventListener('click',()=>{if(o===t.ans){say(msg,'Giusto!','ok');next();}else say(msg,'No: guarda bene la colonna (lettera) e la riga (numero).','no');});return b;})));}
  const tbl=h('table',{class:'xl'});const hr=h('tr',{},h('th',{class:'corner'},''));for(const c of C)hr.append(h('th',{},c));tbl.append(hr);
  for(let r=1;r<=R;r++){const tr=h('tr',{},h('th',{},String(r)));for(const c of C){const a=c+r;const td=h('td',{},vals[a]||'');cells[a]=td;
      td.addEventListener('click',()=>{nameBox.textContent=a;Object.values(cells).forEach(x=>x.classList.remove('hit'));td.classList.add('hit');if(done)return;const t=tasks[k];
        if(t.type==='cell'){if(a===t.a){say(msg,`Giusto: ${a} è colonna ${a[0]}, riga ${a.slice(1)}.`,'ok');next();}else say(msg,`Hai scelto ${a}. Cerca la colonna ${t.a[0]} e poi scendi alla riga ${t.a.slice(1)}.`,'no');}
        else if(t.type==='range'){if(!rangeStart){rangeStart=a;say(msg,`Inizio: ${a}. Ora fai clic sull’ultima cella.`);}else{const[a1,b1]=[rangeStart,a];const c1=Math.min(C.indexOf(a1[0]),C.indexOf(b1[0])),c2=Math.max(C.indexOf(a1[0]),C.indexOf(b1[0])),r1=Math.min(+a1.slice(1),+b1.slice(1)),r2=Math.max(+a1.slice(1),+b1.slice(1));
          for(let cc=c1;cc<=c2;cc++)for(let rr=r1;rr<=r2;rr++)cells[C[cc]+rr].classList.add('rng');nameBox.textContent=`${C[c1]}${r1}:${C[c2]}${r2}`;

{id:'pc-excel-formule',g:3,title:'Le formule di Excel',desc:'Scrivi le formule: =B2+B3, =SOMMA(B2:B6), =MEDIA(…).',glyph:'=SOMMA()',
make(L){
  const SETS=[['Spese della settimana',['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì']],['Punti della squadra',['Partita 1','Partita 2','Partita 3','Partita 4','Partita 5']],['Libri letti',['Gennaio','Febbraio','Marzo','Aprile','Maggio']]];
  const [tit,labs]=pick(SETS);const n=L===0?2:5;const v=labs.slice(0,n).map(()=>rnd(1,L===0?20:50));
  const cells={A1:tit,B1:'Valore'};labs.slice(0,n).forEach((l,i)=>{cells['A'+(i+2)]=l;cells['B'+(i+2)]=v[i];});const last=n+1;
  const tasks=[];
  if(L===0)tasks.push({cell:'B'+(last+1),label:'Totale',t:`Nella cella B${last+1} scrivi la formula che somma B2 e B3. Esempio: =B2+B3`,val:v[0]+v[1]});
  else{tasks.push({cell:'B'+(last+1),label:'Totale',t:`Nella cella B${last+1} calcola il totale con la funzione SOMMA. Esempio: =SOMMA(B2:B${last})`,val:v.reduce((a,b)=>a+b,0)});
    if(L===2){const f=pick([['MEDIA','Media',v.reduce((a,b)=>a+b,0)/n],['MAX','Il più grande',Math.max(...v)],['MIN','Il più piccolo',Math.min(...v)]]);tasks.push({cell:'B'+(last+2),label:f[1],t:`Nella cella B${last+2} usa la funzione ${f[0]} sulle celle da B2 a B${last}.`,val:f[2]});}}
  tasks.forEach(t=>{cells['A'+t.cell.slice(1)]=t.label;});
  const form={};const C='ABC';const R=last+tasks.length+1;
  function val(a){if(form[a]!==undefined)return evalF(form[a]);const x=cells[a];return typeof x==='number'?x:0;}
  function rangeVals(s){const m=s.match(/^([A-C])(\d+):([A-C])(\d+)$/);if(!m)return[val(s)];const out=[];for(let c=C.indexOf(m[1]);c<=C.indexOf(m[3]);c++)for(let r=+m[2];r<=+m[4];r++)out.push(val(C[c]+r));return out;}
  function evalF(f){let s=String(f).trim().toUpperCase().replace(/^=/,'').replace(/\s/g,'').replace(/,(?=\d)/g,'.');
    const FN={SOMMA:a=>a.reduce((x,y)=>x+y,0),SUM:a=>a.reduce((x,y)=>x+y,0),MEDIA:a=>a.reduce((x,y)=>x+y,0)/a.length,AVERAGE:a=>a.reduce((x,y)=>x+y,0)/a.length,MAX:a=>Math.max(...a),MIN:a=>Math.min(...a)};
    for(let g=0;g<10;g++){const m=s.match(/(SOMMA|SUM|MEDIA|AVERAGE|MAX|MIN)\(([^()]*)\)/);if(!m)break;const args=m[2].split(/[;,]/).filter(Boolean).flatMap(x=>/^[\d.]+$/.test(x)?[+x]:rangeVals(x));s=s.replace(m[0],String(FN[m[1]](args)));}
    s=s.replace(/\b([A-C])(\d+)\b/g,(x,c,r)=>String(val(c+r)));
    if(!/^[\d+\-*/().]+$/.test(s))return NaN;try{return Function('"use strict";return ('+s+')')();}catch(e){return NaN;}}
  const tbl=h('table',{class:'xl'});const tds={};
  function render(){tbl.replaceChildren();const hr=h('tr',{},h('th',{class:'corner'},''));for(const c of C)hr.append(h('th',{},c));tbl.append(hr);
    for(let r=1;r<=R;r++){const tr=h('tr',{},h('th',{},String(r)));for(const c of C){const a=c+r;let txt=cells[a]??'';if(form[a]!==undefined){const x=evalF(form[a]);txt=isNaN(x)?'#ERRORE':String(Math.round(x*100)/100).replace('.',',');}
      const td=h('td',{class:(r===1?'hd ':'')+(a===selCell?'hit ':'')+(tasks.some(t=>t.cell===a)?'goal':'')},String(txt));td.addEventListener('click',()=>{selCell=a;nameBox.textContent=a;fx.value=form[a]??(cells[a]??'');render();fx.focus();});tds[a]=td;tr.append(td);}tbl.append(tr);}}
  let selCell=tasks[0].cell;const nameBox=h('div',{class:'namebox'},selCell);
  const fx=h('input',{class:'fxin',id:'fx',autocomplete:'off',autocapitalize:'characters',spellcheck:'false','aria-label':'Barra della formula',placeholder:'Scrivi qui la formula, poi premi Invio'});
  const msg=h('div',{class:'pcmsg'},'Fai clic sulla cella gialla, scrivi la formula nella barra in alto e premi Invio (o ✓).');
  const commit=()=>{const v2=fx.value.trim();if(!v2)return;if(!v2.startsWith('=')){say(msg,'Una formula comincia sempre con il segno =','no');return;}form[selCell]=v2;render();const x=evalF(v2);say(msg,isNaN(x)?'La formula ha un errore: controlla i nomi delle celle e le parentesi.':`Risultato: ${String(Math.round(x*100)/100).replace('.',',')}`,isNaN(x)?'no':'');};
  fx.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();commit();}});
  const ok=h('button',{type:'button',class:'tbtn small'},'✓');ok.addEventListener('click',commit);
  const helpers=h('div',{class:'ribbon'},['=','SOMMA(','MEDIA(','MAX(','MIN(',':',')','+'].slice(0,L===0?2:8).map(t=>{const b=h('button',{type:'button',class:'tbtn small'},t);b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{fx.value+=t;fx.focus();});return b;}));
  render();
  const el=h('div');el.append(h('p',{class:'consegna'},'Le formule in Excel cominciano con =. Fai i calcoli usando i nomi delle celle, non i numeri.'),h('ol',{class:'tasks'},tasks.map(t=>h('li',{},t.t))),
    h('div',{class:'xlbar'},nameBox,h('span',{class:'fx'},'fx'),fx,ok),helpers,msg,h('div',{class:'tablewrap'},tbl));
  const usesRefs=f=>/[A-C]\d/i.test(f||'');
  return{el,check(){let good=true;tasks.forEach(t=>{const f=form[t.cell];const x=f?evalF(f):NaN;const g=usesRefs(f)&&Math.abs(x-t.val)<0.01;tds[t.cell]&&tds[t.cell].classList.toggle('bad',!g);if(!g)good=false;});
      if(!good)say(msg,'Controlla le celle gialle: serve una formula con i nomi delle celle che dia il risultato giusto.','no');return good;},
    solve(){tasks.forEach((t,i)=>{form[t.cell]=L===0?'=B2+B3':i===0?`=SOMMA(B2:B${last})`:`=${t.t.match(/funzione (\w+)/)[1]}(B2:B${last})`;});render();}};
}},

async function rpc(fn,args){
  let r;
  try{r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(args)});}
  catch(e){const err=new Error('Nessuna connessione a Internet. Riprova tra poco.');err.offline=true;throw err;}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||'Errore del server ('+r.status+')');
  return j;
}

function record(corretto,soluzione){
  if(!cur||cur.saved||!sess||!sess.token)return;cur.saved=true;
  queue.push({p_token:sess.token,p_esercizio:curEx.id,p_livello:level,p_corretto:corretto,p_soluzione:soluzione});save('queue',queue);flush();
}
let flushing=false;
async function flush(){
  if(flushing||!queue.length||!sess||!sess.token)return;flushing=true;
  try{while(queue.length){const it=queue[0];
      try{const st=await rpc('qm_salva',it);if(it.p_token===sess.token&&typeof st==='number'){sess.stelle=st;save('sess',sess);}}
      catch(e){if(e.offline)break;if(/scaduto/.test(e.message)){queue.shift();save('queue',queue);setSess(null);location.hash='';route();break;}}
      queue.shift();save('queue',queue);}}
  finally{flushing=false;}
  refreshStars();
}

        r.alunni.length?h('div',{class:'tablewrap'},h('table',{class:'rep'},h('thead',{},h('tr',{},h('th',{},'Alunno'),h('th',{},'Stelle'),h('th',{},'Ultimo accesso'))),tb)):null);}
    catch(x){rosterBox.replaceChildren(h('p',{class:'err',style:'margin:0'},x.message));rLast='';}}
  if(mode==='teacher'&&!teachUnlocked()){view.replaceChildren(h('div',{class:'loginwrap'},pinGate(()=>loginView('teacher'))));setTimeout(()=>{try{$('g-pin').focus();}catch(e){}},50);return;}
  if(mode==='teacher')view.replaceChildren(h('div',{class:'loginwrap'},
    h('div',{},h('h1',{class:'hero'},'Area insegnante'),h('p',{class:'intro'},'Crea una classe e dai il codice agli alunni, oppure apri i progressi della tua classe con il codice e il PIN. I progressi mostrano tutte le materie.')),
    h('div',{class:'logingrid'},fNew,fRep)));
  else view.replaceChildren(h('div',{class:'loginwrap'},
    h('div',{},h('h1',{class:'hero'},'Accesso alunni'),h('p',{class:'intro'},'Scrivi il codice della classe che ti ha dato l’insegnante e il tuo nome. I tuoi esercizi e le tue stelle restano salvati su ogni dispositivo.')),
    h('div',{class:'logingrid one'},fStud,rosterBox),guest));
  $('l-cod').addEventListener('input',()=>{clearTimeout(rT);rT=setTimeout(loadRoster,350);});loadRoster();
  $('main').scrollTop=0;
}

const when=d=>d?new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
async function teacherView(){
  curEx=null;cur=null;dock.hidden=true;$('back').hidden=false;showHeader('teacher');
  if(!teacher){loginView('teacher');return;}
  view.replaceChildren(h('p',{class:'intro'},'Carico i progressi…'));
  let rep;try{rep=await rpc('qm_report',{p_codice:teacher.codice,p_pin:teacher.pin});}
  catch(x){view.replaceChildren(h('p',{class:'err'},x.message),h('button',{class:'btn',type:'button',onclick:teacherView},'Riprova'));return;}
  const al=rep.alunni||[];
  const tot=al.reduce((a,x)=>a+x.tentativi,0),ok=al.reduce((a,x)=>a+x.corretti,0);
  const head=h('div',{class:'sheet'},h('div',{class:'kicker'},'Pagina insegnante'),h('h1',{},rep.classe),
    h('div',{class:'codebox'},h('span',{},'Codice da dare agli alunni'),h('b',{},rep.codice)),
    h('div',{class:'kpis'},h('div',{},h('b',{},String(al.length)),h('span',{},'alunni')),h('div',{},h('b',{},String(tot)),h('span',{},'esercizi svolti')),h('div',{},h('b',{},tot?Math.round(ok/tot*100)+'%':'—'),h('span',{},'risolti da soli'))),
    h('button',{class:'btn',type:'button',onclick:teacherView},'Aggiorna'));
  const list=h('div',{class:'sheet',style:'margin-top:16px'});
  if(!al.length)list.append(h('p',{class:'intro'},`Nessun alunno ancora. Gli alunni aprono la pagina principale, toccano «Entra con il codice della classe» e scrivono il codice ${rep.codice} e il proprio nome.`));
  else{const tb=h('table',{class:'rep'},h('thead',{},h('tr',{},h('th',{},'Alunno'),h('th',{},'★'),h('th',{},'Esercizi'),h('th',{},'Risolti da soli'),h('th',{},'Ultimo accesso'),h('th',{},''))));
    const body=h('tbody');tb.append(body);
    al.forEach(a=>{const pct=a.tentativi?Math.round(a.corretti/a.tentativi*100):null;
      const det=h('tr',{class:'det',hidden:true},h('td',{colspan:'6'}));
      const btn=h('button',{class:'ghost',type:'button'},'Dettagli');
      btn.addEventListener('click',()=>{det.hidden=!det.hidden;btn.textContent=det.hidden?'Dettagli':'Chiudi';});
      body.append(h('tr',{},h('td',{},h('b',{},a.nome)),h('td',{class:'n'},String(a.stelle)),h('td',{class:'n'},String(a.tentativi)),
        h('td',{},pct==null?'—':h('span',{class:'bar'},h('i',{style:`width:${pct}%`}),h('em',{},pct+'%'))),h('td',{},when(a.ultimo_accesso)),h('td',{},btn)),det);
      const inner=h('div',{class:'detbox'});
      if(a.esercizi.length){const t2=h('table',{class:'rep small'},h('thead',{},h('tr',{},h('th',{},'Esercizio'),h('th',{},'Svolti'),h('th',{},'Risolti da soli'),h('th',{},'Soluzione vista'),h('th',{},'Ultima volta'))));
        const b2=h('tbody');a.esercizi.forEach(e=>b2.append(h('tr',{},h('td',{},exTitle(e.esercizio)),h('td',{class:'n'},String(e.tentativi)),h('td',{class:'n'},String(e.corretti)),h('td',{class:'n'},String(e.soluzioni)),h('td',{},when(e.ultimo)))));t2.append(b2);inner.append(t2);}
      else inner.append(h('p',{},'Nessun esercizio svolto.'));
      det.firstChild.append(inner);});
    list.append(h('div',{class:'tablewrap'},tb));}
  const today=new Date().toDateString();
  const ros=h('div',{class:'sheet',style:'margin-top:16px'},h('h2',{class:'sech'},`Alunni della classe (${al.length})`),
    h('p',{class:'intro',style:'margin:0 0 10px'},'Qui trovi tutti gli alunni che sono entrati nella classe. Tocca «Elimina» due volte per cancellare un alunno con tutti i suoi risultati.'));
  if(!al.length)ros.append(h('p',{class:'intro'},`Ancora nessun alunno. Dai il codice ${rep.codice} agli alunni.`));
  else{const ul=h('div',{class:'roster'});
    al.forEach(a=>{const oggi=new Date(a.ultimo_accesso).toDateString()===today;
      const del=h('button',{class:'ghost danger',type:'button'},'🗑️ Elimina');let armed=false,tm=null;
      del.addEventListener('click',async()=>{if(!armed){armed=true;del.textContent='Tocca ancora per confermare';del.classList.add('armed');tm=setTimeout(()=>{armed=false;del.textContent='🗑️ Elimina';del.classList.remove('armed');},4000);return;}
        clearTimeout(tm);del.disabled=true;del.textContent='Elimino…';

      ul.append(h('div',{class:'rrow'},h('span',{class:'av','aria-hidden':'true'},a.nome.slice(0,1).toUpperCase()),
        h('div',{class:'rinfo'},h('b',{},a.nome),h('small',{},(oggi?'🟢 entrato oggi · ':'Ultimo accesso: ')+when(a.ultimo_accesso)+` · ★ ${a.stelle} · ${a.tentativi} esercizi`)),del));});
    ros.append(ul);}
  view.replaceChildren(head,ros,list);
}

function home(){curEx=null;cur=null;active=null;dock.hidden=true;$('back').hidden=true;showHeader('app');
  view.replaceChildren(h('p',{class:'intro'},(sess&&sess.token?`Ciao ${sess.nome}! `:'')+'Scegli un esercizio. Ogni volta che premi «Nuovo esercizio» ne viene creato uno diverso. Il livello in alto cambia la difficoltà.'),
    ...GROUPS.map((g,gi)=>h('section',{class:'group'},h('h2',{},g),h('div',{class:'tiles'},EX.filter(e=>e.g===gi).map(e=>h('button',{type:'button',class:'tile',onclick:()=>{location.hash=e.id;}},h('span',{class:'glyph'},e.glyph),h('b',{},e.title),h('span',{},e.desc)))))));
  $('main').scrollTop=0;}
let area;
function openEx(ex){curEx=ex;$('back').hidden=false;dock.hidden=false;showHeader('app');area=h('div');
  view.replaceChildren(h('div',{class:'sheet'},h('div',{class:'kicker'},GROUPS[ex.g]),h('h1',{},ex.title),area));newEx();}
function newEx(){active=null;cur=curEx.make(level);cur.solved=false;cur.shown=false;cur.wrong=false;cur.saved=false;area.replaceChildren(cur.el);
  const hasSlots=!!cur.el.querySelector('.slot');keypad.hidden=!hasSlots;setFb('','');
  if(hasSlots){const f=cur.el.querySelector('.slot');if(f)focusSlot(f);}$('main').scrollTop=0;}
function setFb(t,c){fb.textContent=t;fb.className='fb '+c;}
$('bNew').addEventListener('click',()=>{leaveEx();newEx();});
$('bSol').addEventListener('click',()=>{if(!cur)return;cur.solve();if(!cur.solved){cur.shown=true;record(false,true);}setFb('Ecco la soluzione. Prova con un nuovo esercizio!','info');});
$('bChk').addEventListener('click',doCheck);
function doCheck(){if(!cur)return;const ok=cur.check();
  if(ok){const fresh=!cur.solved&&!cur.shown;setFb(pick(['Bravo!','Ottimo lavoro!','Perfetto!','Esatto!','Che campione!'])+(fresh?' +1 ★':''),'ok');
    if(fresh){stars++;if(!(sess&&sess.token))save('stars-'+SUBJ,stars);showStars();popStars();record(true,false);}cur.solved=true;}
  else{cur.wrong=true;setFb('Quasi! Controlla le parti in rosso e riprova.','no');}}
document.addEventListener('keydown',e=>{if(!curEx||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(/^[0-9]$/.test(e.key))keyPress(e.key);else if(e.key==='-')keyPress('neg');else if(e.key===','||e.key==='.')keyPress('comma');else if(e.key==='Backspace'){e.preventDefault();keyPress('back');}else if(e.key==='Enter'){e.preventDefault();doCheck();}});
function route(){
  const hs=location.hash.slice(1);
  if(curEx&&EX.find(e=>e.id===hs)!==curEx)leaveEx();
  if(hs==='insegnante')return teacherView();
  if(!sess)return loginView();
  const ex=EX.find(e=>e.id===hs);ex?openEx(ex):home();
}
window.addEventListener('hashchange',route);route();flush();refreshStars();
window.addEventListener('pagehide',leaveEx);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('../sw.js',{scope:'../'}).then(r=>r.update()).catch(()=>{});
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{});}catch(e){}
